<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Crear producto')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="admin-layout">
      <aside th:replace="~{fragments/layout :: sidebar}"></aside>
      <main id="contenido" class="admin-main">
        <nav class="breadcrumb">
          <a href="/productos">Productos</a><span>/</span
          ><span>Crear producto</span>
        </nav>
        <div class="page-heading">
          <div>
            <h1>Crear producto</h1>
            <p>La información que tus clientes necesitan para elegir.</p>
          </div>
        </div>
        <form
          class="product-form"
          th:action="@{/productos/save}"
          method="post"
          enctype="multipart/form-data"
        >
          <section class="panel form-panel">
            <h2>Información del producto</h2>
            <div class="form-field">
              <label for="nombre">Nombre del producto</label
              ><input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej. Audífonos Sony WH-1000XM5"
                maxlength="255"
                required
              />
            </div>
            <div class="form-field">
              <label for="descripcion">Descripción</label
              ><textarea
                rows="4"
                id="descripcion"
                name="descripcion"
                placeholder="Características que ayudan a elegir"
                maxlength="2000"
                required
              ></textarea>
            </div>
            <div class="form-field">
              <label for="cantidad">Unidades en stock</label
              ><input
                type="number"
                id="cantidad"
                name="cantidad"
                placeholder="0"
                min="0"
                step="1"
                required
              />
            </div>
            <div class="form-field">
              <label for="precio">Precio en soles (S/)</label
              ><input
                type="number"
                id="precio"
                name="precio"
                placeholder="0.00"
                min="0"
                step="0.01"
                required
              />
            </div>
            <div class="form-actions">
              <button class="button" type="submit">Guardar producto</button
              ><a href="/productos" class="button secondary">Cancelar</a>
            </div>
          </section>
          <aside class="panel upload-panel">
            <h2>Imagen del producto</h2>
            <div class="upload-preview">
              <img
                id="image-preview"
                src="/images/default.jpg"
                alt="Vista previa del producto"
                width="280"
                height="280"
              />
            </div>
            <label for="img">Seleccionar imagen</label
            ><input
              id="img"
              name="img"
              type="file"
              accept="image/jpeg,image/png,image/webp"
            />
            <p>JPG, PNG o WebP. Máximo 5 MB.</p>
            <p>Una fotografía clara ayuda a conocer el producto.</p>
          </aside>
        </form>
      </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
