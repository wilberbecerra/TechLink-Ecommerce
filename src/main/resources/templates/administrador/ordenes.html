<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Órdenes')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="admin-layout">
      <aside th:replace="~{fragments/layout :: sidebar}"></aside>
      <main id="contenido" class="admin-main">
        <div class="page-heading">
          <div>
            <span class="section-label">Administración / Ventas</span>
            <h1>Órdenes de compra</h1>
            <p>Consulta las compras y sus comprobantes.</p>
          </div>
          <span
            class="pill"
            th:text="${#lists.size(ordenes) + ' órdenes'}"
          ></span>
        </div>
        <div class="panel table-panel">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Orden</th>
                  <th>Cliente</th>
                  <th>Fecha</th>
                  <th class="numeric">Total</th>
                  <th>Detalle</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="o : ${ordenes}">
                  <td><strong th:text="${'#' + o.numero}"></strong></td>
                  <td th:text="${o.usuario.nombre}"></td>
                  <td
                    th:text="${#dates.format(o.fechaCreacion,'dd MMM yyyy · HH:mm')}"
                  ></td>
                  <td class="numeric">
                    <strong
                      ><span
                        th:text="${'S/ ' + #numbers.formatDecimal(o.total, 1, 'COMMA', 2, 'POINT')}"
                        >S/ 0.00</span
                      ></strong
                    >
                  </td>
                  <td>
                    <a
                      class="button compact secondary"
                      th:href="@{/administrador/detalle/{id}(id=${o.id})}"
                      >Ver detalle</a
                    >
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="empty-state" th:if="${#lists.isEmpty(ordenes)}">
            <h2>Aún no hay compras</h2>
            <p>Las órdenes aparecerán aquí cuando se confirme una compra.</p>
          </div>
        </div>
      </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
