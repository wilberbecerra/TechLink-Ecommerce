<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Detalle de orden')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="admin-layout">
      <aside th:replace="~{fragments/layout :: sidebar}"></aside>
      <main id="contenido" class="admin-main">
        <nav class="breadcrumb">
          <a href="/administrador/ordenes">Órdenes</a><span>/</span
          ><span>Detalle</span>
        </nav>
        <div class="page-heading">
          <div>
            <span class="section-label">Detalle de compra</span>
            <h1>Orden <span th:text="${'#' + orden.numero}"></span></h1>
            <p
              th:text="${#dates.format(orden.fechaCreacion,'dd MMMM yyyy · HH:mm')}"
            ></p>
          </div>
          <a
            class="button"
            th:href="@{/pdf/{id}(id=${orden.id})}"
            target="_blank"
            rel="noopener"
            ><svg class="icon" aria-hidden="true">
              <use href="/brand/icons.svg#download"></use></svg
            >Comprobante PDF</a
          >
        </div>
        <section class="order-customer panel">
          <div>
            <span>Cliente</span
            ><strong th:text="${orden.usuario.nombre}"></strong>
          </div>
          <div>
            <span>Correo electrónico</span
            ><strong th:text="${orden.usuario.email}"></strong>
          </div>
          <div>
            <span>Dirección</span
            ><strong th:text="${orden.usuario.direccion}"></strong>
          </div>
        </section>
        <div class="panel table-panel">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Producto</th>
                  <th class="numeric">Cantidad</th>
                  <th class="numeric">Precio unitario</th>
                  <th class="numeric">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="d : ${detalles}">
                  <td>
                    <div class="table-product">
                      <img
                        th:src="@{/images/{img}(img=${d.producto.imagen})}"
                        alt=""
                        width="56"
                        height="56"
                      /><strong th:text="${d.nombre}"></strong>
                    </div>
                  </td>
                  <td
                    class="numeric"
                    th:text="${#numbers.formatInteger(d.cantidad,1)}"
                  ></td>
                  <td class="numeric">
                    <span
                      th:text="${'S/ ' + #numbers.formatDecimal(d.precio, 1, 'COMMA', 2, 'POINT')}"
                      >S/ 0.00</span
                    >
                  </td>
                  <td class="numeric">
                    <strong
                      ><span
                        th:text="${'S/ ' + #numbers.formatDecimal(d.total, 1, 'COMMA', 2, 'POINT')}"
                        >S/ 0.00</span
                      ></strong
                    >
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="order-total">
            <span>Total de la orden</span
            ><strong
              ><span
                th:text="${'S/ ' + #numbers.formatDecimal(orden.total, 1, 'COMMA', 2, 'POINT')}"
                >S/ 0.00</span
              ></strong
            >
          </div>
        </div>
      </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
