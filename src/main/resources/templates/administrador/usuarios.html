<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="admin-layout">
      <aside th:replace="~{fragments/layout :: sidebar}"></aside>
      <main id="contenido" class="admin-main">
        <div class="page-heading">
          <div>
            <span class="section-label">Administración / Comunidad</span>
            <h1>Usuarios</h1>
            <p>Las personas que forman parte de TechLink.</p>
          </div>
          <span
            class="pill"
            th:text="${#lists.size(usuarios) + ' usuarios'}"
          ></span>
        </div>
        <div class="panel table-panel">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Correo electrónico</th>
                  <th>Dirección</th>
                  <th>Rol</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="u : ${usuarios}">
                  <td>
                    <div class="user-cell">
                      <span
                        class="avatar"
                        th:text="${#strings.substring(u.nombre,0,1)}"
                      ></span
                      ><strong th:text="${u.nombre}"></strong>
                    </div>
                  </td>
                  <td th:text="${u.email}"></td>
                  <td th:text="${u.direccion}"></td>
                  <td>
                    <span
                      class="pill"
                      th:text="${u.tipo == 'ADMIN' ? 'Administrador' : 'Cliente'}"
                    ></span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
