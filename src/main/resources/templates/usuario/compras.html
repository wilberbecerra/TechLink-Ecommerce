<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Mis compras')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main id="contenido" class="container page">
      <nav class="breadcrumb">
        <a href="/">Inicio</a><span>/</span><span>Mis compras</span>
      </nav>
      <div class="page-heading">
        <div>
          <h1>Mis compras</h1>
          <p>Tus próximos upgrades, todos en un lugar.</p>
        </div>
        <a href="/#catalogo" class="button secondary">Explorar catálogo</a>
      </div>
      <div class="panel table-panel">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Orden</th>
                <th>Fecha</th>
                <th class="numeric">Total</th>
                <th>Detalle</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="o : ${ordenes}">
                <td><strong th:text="${'#' + o.numero}"></strong></td>
                <td
                  th:text="${#dates.format(o.fechaCreacion,'dd MMM yyyy · HH:mm')}"
                ></td>
                <td class="numeric">
                  <strong
                    ><span
                      th:text="${'S/ ' + #numbers.formatDecimal(o.total, 1, 'COMMA', 2, 'POINT')}"
                      >S/ 0.00</span
                    ></strong
                  >
                </td>
                <td>
                  <a
                    class="button compact secondary"
                    th:href="@{/usuario/detalle/{id}(id=${o.id})}"
                    >Ver detalle</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(ordenes)}">
          <h2>Aún no hay compras</h2>
          <p>Las órdenes aparecerán aquí cuando se confirme una compra.</p>
        </div>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
