<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Detalle del producto')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main id="contenido" class="container page">
      <nav class="breadcrumb" aria-label="Ubicación">
        <a href="/">Inicio</a><span>/</span><a href="/#catalogo">Catálogo</a
        ><span>/</span><span th:text="${producto.categoria}">Producto</span>
      </nav>
      <div class="product-detail">
        <div class="detail-image">
          <img
            th:src="@{/images/{img}(img=${producto.imagen})}"
            th:alt="${producto.nombre}"
            width="550"
            height="520"
          />
        </div>
        <section class="detail-copy">
          <span class="pill" th:text="${producto.categoria}">Audio</span>
          <h1 th:text="${producto.nombre}">Producto</h1>
          <p class="detail-description" th:text="${producto.descripcion}"></p>
          <div class="detail-price">
            <span
              th:text="${'S/ ' + #numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}"
              >S/ 0.00</span
            ><span>Precio en soles</span>
          </div>
          <p
            class="stock-text"
            th:text="${producto.cantidad > 0 ? producto.cantidad + ' unidades disponibles' : 'Producto agotado'}"
          ></p>
          <form th:action="@{/cart}" method="post" class="add-cart-form">
            <input type="hidden" name="id" th:value="${producto.id}" /><label
              for="cantidad"
              >Cantidad</label
            >
            <div class="buy-row">
              <input
                id="cantidad"
                name="cantidad"
                type="number"
                min="1"
                th:max="${producto.cantidad}"
                value="1"
                required
                th:disabled="${producto.cantidad == 0}"
              /><button
                class="button"
                type="submit"
                th:disabled="${producto.cantidad == 0}"
              >
                <svg class="icon" aria-hidden="true">
                  <use href="/brand/icons.svg#bag"></use></svg
                >Agregar al carrito
              </button>
            </div>
          </form>
          <div class="detail-facts">
            <span
              ><svg class="icon" aria-hidden="true">
                <use href="/brand/icons.svg#box"></use></svg
              >Consulta stock en tiempo real</span
            ><span
              ><svg class="icon" aria-hidden="true">
                <use href="/brand/icons.svg#receipt"></use></svg
              >Comprobante de tu compra en PDF</span
            >
          </div>
        </section>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
