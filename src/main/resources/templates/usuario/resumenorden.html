<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Confirmar compra')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main id="contenido" class="container page">
      <nav class="breadcrumb">
        <a href="/getCart">Carrito</a><span>/</span><span>Confirmación</span>
      </nav>
      <div class="page-heading">
        <div>
          <h1>Todo listo para conectar.</h1>
          <p>Revisa tu pedido y confirma la compra.</p>
        </div>
        <span class="pill">Último paso</span>
      </div>
      <div class="checkout-grid">
        <div>
          <section class="panel customer-panel">
            <h2>Tus datos</h2>
            <dl>
              <div>
                <dt>Nombre</dt>
                <dd th:text="${usuario.nombre}"></dd>
              </div>
              <div>
                <dt>Correo</dt>
                <dd th:text="${usuario.email}"></dd>
              </div>
              <div>
                <dt>Dirección</dt>
                <dd th:text="${usuario.direccion}"></dd>
              </div>
            </dl>
          </section>
          <div class="cart-items">
            <article class="cart-item" th:each="d : ${cart}">
              <a th:href="@{/productohome/{id}(id=${d.producto.id})}"
                ><img
                  th:src="@{/images/{img}(img=${d.producto.imagen})}"
                  th:alt="${d.nombre}"
                  width="100"
                  height="100"
              /></a>
              <div>
                <span
                  class="product-category"
                  th:text="${d.producto.categoria}"
                ></span>
                <h3 th:text="${d.nombre}"></h3>
                <p>
                  Cantidad:
                  <span
                    th:text="${#numbers.formatInteger(d.cantidad,1)}"
                  ></span>
                </p>
                <form
                  th:action="@{/delete/cart/{id}(id=${d.producto.id})}"
                  method="post"
                >
                  <button class="text-button danger" type="submit">
                    Quitar producto
                  </button>
                </form>
              </div>
              <strong
                ><span
                  th:text="${'S/ ' + #numbers.formatDecimal(d.total, 1, 'COMMA', 2, 'POINT')}"
                  >S/ 0.00</span
                ></strong
              >
            </article>
          </div>
        </div>
        <aside class="summary-panel">
          <h2>Tu pedido</h2>
          <div class="summary-line">
            <span>Productos</span><span th:text="${#lists.size(cart)}"></span>
          </div>
          <div class="summary-line total">
            <span>Total</span
            ><strong
              ><span
                th:text="${'S/ ' + #numbers.formatDecimal(orden.total, 1, 'COMMA', 2, 'POINT')}"
                >S/ 0.00</span
              ></strong
            >
          </div>
          <form th:action="@{/saveOrder}" method="post">
            <button class="button full" type="submit">Confirmar compra</button>
          </form>
          <p>Compra de demostración. No se procesan pagos ni cargos.</p>
        </aside>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
