spring.application.name=techlink
server.port=${PORT:8080}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TechLink;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:techlink_local}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.error.include-message=never
techlink.demo.enabled=${TECHLINK_DEMO_ENABLED:false}
techlink.demo.admin-password=${TECHLINK_DEMO_ADMIN_PASSWORD:}
techlink.demo.customer-password=${TECHLINK_DEMO_CUSTOMER_PASSWORD:}
